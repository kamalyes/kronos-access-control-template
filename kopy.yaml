# ============================================================================
# kronos-access-control-template
#
# 网关鉴权服务模板：实现协议中心 access_control 模块的 AuthService.Authorities。
# 网关在每个 HTTP 请求前调它判断是否放行，并取回调用者身份（Payload）。
#
# ⚠️ service/auth 是**桩实现**：不验签、不查吊销、不看过期，任何字符串都算
# 有效 token。它存在的目的是让「网关 → 鉴权 → 下游」这条链路能跑通，
# 并把真实实现该在哪几处接什么写清楚（代码里三个 TODO）。
# 桩在生产级别环境会拒绝启动，见 bootstrap/server.go。
#
# 与另两个服务模板的分工：
#   kronos-service-template      业务服务（有库有缓存，gRPC + 自己的 HTTP）
#   kronos-key-service-template  基础设施（密钥与发号，纯 gRPC）
#   本模板                       鉴权（纯 gRPC，且刻意没有 HTTP 路由）
#
# [EN] A gateway authorization service template implementing the contract hub's
# AuthService.Authorities, which the gateway calls before every HTTP request to decide whether
# to allow it and to retrieve the caller's identity. service/auth is a stub that verifies no
# signature, no revocation and no expiry, so any string is a valid token; it exists to make the
# gateway-authorization-downstream path work end to end and to mark where a real implementation
# plugs in, and it refuses to start at production level.
# ============================================================================

name: kronos-access-control-template
description: "网关鉴权服务模板（桩实现，可替换）| Gateway authorization service template, a replaceable stub"
delimiters: ["<%", "%>"]

questions:
  - name: OrgName
    prompt: "GitHub 组织名 | GitHub organization"
    type: string
    default: kamalyes
    required: true

  - name: ObjectPrefix
    prompt: "项目前缀（用于项目名与命名空间）| Project prefix"
    type: string
    default: kronos
    required: true

  - name: ServiceType
    prompt: "服务类型标识 | Service type identifier"
    type: string
    default: access-control
    required: true

  - name: ServiceName
    prompt: "服务名称（PascalCase）| Service name in PascalCase"
    type: string
    default: "<% .ServiceType | pascal %>Service"
    required: true

  - name: ModuleName
    prompt: "模块名称（小写）| Module name, lower case"
    type: string
    default: "<% .ServiceType %>-service"
    required: true

  - name: ProjectName
    prompt: "项目名称（同时是配置文件前缀）| Project name, also the config prefix"
    type: string
    default: "<% .ObjectPrefix %>-<% .ServiceType %>-service"
    required: true

  - name: GoVersion
    prompt: "Go 版本 | Go version"
    type: select
    choices: ["1.22", "1.23", "1.24", "1.25"]
    default: "1.25"

  - name: AuthorName
    prompt: "作者名称 | Author name"
    type: string
    default: kamalyes
    required: true

  - name: AuthorEmail
    prompt: "作者邮箱 | Author email"
    type: string
    default: example@qq.com
    required: true

  - name: BaseBranch
    prompt: "主干分支名 | Trunk branch"
    type: string
    default: master
    required: true

  - name: AiAssistant
    prompt: "AI 规范目录 | AI convention directory"
    type: select
    choices: [".trae", ".claude", ".cursor", ".vscode"]
    default: ".trae"

  # --------------------------------------------------------------------------
  # 协议中心 | Contract hub
  # --------------------------------------------------------------------------
  - name: ShareProtoModule
    prompt: "协议中心 Go 模块路径 | Go module path of the contract hub"
    type: string
    # 默认指向协议模板的 build 分支，与 kronos-service-template 同源。
    # master 全是占位符不是合法 Go，build 分支是它的 CI 渲染 + 生成 + 验证后的产物。
    # 两个服务模板指向同一个分支，所以 key 模块的定义天然一致，
    # 不需要人工保持两份 proto 同步。
    #
    # [EN] Points at the contract-hub template's build branch, the same source as the service
    # template. Its master is placeholders rather than valid Go, while build is what its CI
    # renders, generates and verifies. Both service templates consume one branch, so the key
    # module's definition is identical by construction.
    default: "github.com/kamalyes/kronos-share-proto-template"
    required: true

  - name: ShareProtoVersion
    prompt: "协议中心依赖版本（分支名 / tag / latest）| Contract-hub version"
    type: string
    default: "build"
    required: true

  # --------------------------------------------------------------------------
  # 运行参数 | Runtime
  # --------------------------------------------------------------------------
  - name: GRPCPort
    prompt: "gRPC 端口 | gRPC port"
    type: string
    default: "9390"
    required: true

  - name: HTTPPort
    prompt: "HTTP 端口 | HTTP port"
    type: string
    default: "8390"
    required: true

  - name: HealthPort
    prompt: "健康检查端口 | Health check port"
    type: string
    default: "8391"
    required: true

  - name: PipelineRepo
    prompt: "复用型工作流仓库 | Reusable-workflow repository"
    type: string
    default: kamalyes/deploy-pipeline
    required: true

# ============================================================================
# 忽略 | Ignore
# ============================================================================
ignore:
  - "kopy.yaml"
  - "__kopy_template_doc__"
  - ".git/"
  - ".git/**"
  - ".DS_Store"
  - "go.sum"

# ============================================================================
# 重命名 | Rename
# ============================================================================
rename:
  - pattern: ".yml.tpl"
    value: ".yml"
  - pattern: "README.md"
    value: "__kopy_template_doc__"
  - pattern: "readme-en.tpl"
    value: "README.en.md"
  - pattern: "readme.tpl"
    value: "README.md"
  - pattern: "__ai_home__"
    value: "<% .AiAssistant %>"
  - pattern: "__project_name__"
    value: "<% .ProjectName %>"
  - pattern: "__module_name__"
    value: "<% .ModuleName %>"

# ============================================================================
# 生命周期钩子 | Lifecycle hooks
# ============================================================================
hooks:
  after:
    - bash scripts/init.sh
